spring.application.name=aihrmsbackend
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ai_hrms
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8081

# Recruitment module — resume file storage (relative to process working directory)
recruitment.resume.upload-dir=./uploads/resumes

# Gemini cloud agent (same pattern as geminiDummy — key from env, never commit secrets)
gemini.api.key=${GOOGLE_API_KEY:}
gemini.model=gemini-2.0-flash

# Multipart upload limits for resumes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB