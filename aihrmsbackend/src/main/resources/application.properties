spring.application.name=aihrmsbackend
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ai_hrms
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8081

# Recruitment module — resume file storage (relative to process working directory)
recruitment.resume.upload-dir=./uploads/resumes
# Gemini ? set GOOGLE_API_KEY (or gemini.api-key). Per-task model routing:
gemini.api-key=${GOOGLE_API_KEY:AIzaSyABB5NECntkwLSb_1wNqQ8fD_ViwkVD-YA}
gemini.models.primary=gemini-3.8-flash
gemini.models.fast=gemini-3.5-flash-lite
# Skill/rank stay on fast; questions use primary for better interview quality
gemini.models.skill=${gemini.models.fast}
gemini.models.questions=${gemini.models.primary}
gemini.models.rank=${gemini.models.fast}
gemini.models.chat=${gemini.models.fast}
gemini.models.summary=${gemini.models.primary}
gemini.ranking.use-ai=false
gemini.skill.max-chars=12000
gemini.questions.max=8

# Multipart upload limits for resumes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Auth / JWT (override secret via env in real deployments)
jwt.secret=${JWT_SECRET:aihrms-dev-secret-change-me-please-32chars}
jwt.expiration-ms=86400000

# Bootstrap SUPER_ADMIN ? only works while employee table is empty (override via env)
auth.bootstrap.email=${AUTH_BOOTSTRAP_EMAIL:admin@localhost}
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:Admin@12345}
auth.bootstrap.name=${AUTH_BOOTSTRAP_NAME:Super Admin}